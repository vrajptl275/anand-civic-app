databases:
  - name: anand-civic-db
    plan: free

services:
  - type: web
    name: anand-civic-backend
    env: python
    plan: free
    # Force Render to run inside the backend folder!
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --log-file -"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anand-civic-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
