<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Anand Civic Issues</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../public/css/style.css?v=3.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-card">
    <button class="theme-toggle auth-theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
        <i class="bi bi-moon-stars-fill"></i>
    </button>
    <div class="split-layout">
        <!-- Brand/Splash Side -->
        <div class="split-left d-none d-lg-flex">
            <div class="split-content text-center">
                <i class="bi bi-person-bounding-box" style="font-size: 5rem; margin-bottom: 2rem; display: block;"></i>
                <h1 class="display-4 fw-bold mb-4">Join the Network</h1>
                <p class="lead fw-normal px-5">Register your verified citizen profile to instantly report issues and connect directly with municipal officers in real-time.</p>
            </div>
            <div class="split-overlay"></div>
        </div>
        
        <!-- Form Side -->
        <div class="split-right py-5">
            <div class="form-container w-100 mx-auto" style="max-width: 500px;">
                <div class="mb-3">
                    <a href="../home/index.html" class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center">
                        <i class="bi bi-arrow-left me-2"></i> Back to Home
                    </a>
                </div>
                <a href="../home/index.html" class="text-decoration-none d-block d-lg-none mb-4 h4 text-dark fw-bold">
                    <i class="bi bi-building text-primary"></i> Anand Civic
                </a>
                
                <h2 class="fw-bold mb-2">Create Account</h2>
                <p class="text-muted mb-4 pb-2">We just need a few details to get your dashboard set up.</p>
                
                <!-- Alert Container -->
                <div id="alert-container"></div>
                
                <form id="register-form">
                    <div class="row g-3 mb-3">
                        <div class="col-12">
                            <label for="name" class="form-label fw-bold">Full Legal Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0 form-control-lg" id="name" required placeholder="John Doe">
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0 form-control-lg" id="email" required placeholder="name@email.com">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="phone" class="form-label fw-bold">Mobile Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                            <input type="tel" class="form-control border-start-0 ps-0 form-control-lg" id="phone" required placeholder="+91 xxxxx xxxxx">
                        </div>
                    </div>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" required minlength="6" placeholder="••••••••">
                        </div>
                        <div class="col-md-6">
                            <label for="confirm-password" class="form-label fw-bold">Confirm</label>
                            <input type="password" class="form-control form-control-lg" id="confirm-password" required placeholder="••••••••">
                        </div>
                    </div>
                    
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input mt-2" id="terms" required>
                        <label class="form-check-label text-muted small" for="terms">
                            By registering, I solemnly declare all info is correct and I accept the <a href="#" class="text-decoration-none fw-bold">Municipal Platform Terms</a>.
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-4 rounded-pill">
                        Verify & Create Account
                    </button>
                </form>
                
                <div class="text-center pb-5">
                    <p class="text-muted">Already registered? 
                        <a href="../auth/login.html" class="text-decoration-none fw-bold">Sign in here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../public/js/main.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const role = 'citizen'; // Default role for public registration
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Validate password match
            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'danger');
                return;
            }
            
            // Validate password length
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters', 'danger');
                return;
            }
            
            const result = await register(name, email, phone, password, role);
            
            if (result.success) {
                showAlert('Registration successful! Redirecting to login...', 'success');
                
                setTimeout(() => {
                    window.location.href = '../auth/login.html';
                }, 1500);
            } else {
                showAlert(result.error, 'danger');
            }
        });
    </script>
</body>
</html>
