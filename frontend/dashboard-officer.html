<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officer Dashboard - Anand Civic Issues</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <!-- Modern App Shell Layout -->
    <div class="d-flex" style="height: 100vh; overflow: hidden; background-color: var(--bg-main);">
        
        <!-- Sidebar -->
        <nav id="sidebarMenu" class="sidebar bg-card border-end d-flex flex-column" style="width: 250px; z-index: 1040; flex-shrink: 0;">
            <div class="d-md-none text-end p-2 pb-0">
                <button class="btn border-0 text-muted" onclick="document.getElementById('sidebarMenu').classList.remove('show');"><i class="bi bi-x-lg fs-4"></i></button>
            </div>
            <div class="p-4 border-bottom text-center d-none d-md-block">
                <a href="index.html" class="text-decoration-none">
                    <i class="bi bi-hexagon-fill text-primary" style="font-size: 2.2rem;"></i>
                    <h5 class="fw-bold mt-2 text-dark mb-0 tracking-tight">Anand Civic</h5>
                </a>
            </div>
            <div class="flex-grow-1 overflow-auto py-3 px-2">
                <ul class="nav flex-column gap-1">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="document.getElementById('sidebarMenu').classList.remove('show'); showSection('dashboard')">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="document.getElementById('sidebarMenu').classList.remove('show'); showSection('assigned')">
                            <i class="bi bi-list-task"></i> Assigned Tasks
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="document.getElementById('sidebarMenu').classList.remove('show'); showSection('update-status')">
                            <i class="bi bi-pencil-square"></i> Update Status
                        </a>
                    </li>
                    <li class="nav-item position-relative">
                        <a class="nav-link" href="#" onclick="document.getElementById('sidebarMenu').classList.remove('show'); showSection('notifications')">
                            <i class="bi bi-bell"></i> Notifications
                            <span class="notification-badge shadow-sm" id="notification-count" style="display: none; position: absolute; right: 15px; top: 12px; background: #ff3b30; color: white; border-radius: 50%; padding: 2px 7px; font-size: 0.75rem; font-weight: bold;">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main Workspace Area -->
        <main class="flex-grow-1 d-flex flex-column" style="overflow: hidden; width: 0;">
            <!-- Top Header Profile Bar -->
            <header class="bg-card w-100 py-3 px-4 border-bottom d-flex justify-content-between align-items-center shadow-sm" style="z-index: 1030;">
                <div class="d-flex align-items-center">
                    <button class="btn btn-light d-md-none border-0 bg-transparent me-2" onclick="document.getElementById('sidebarMenu').classList.toggle('show');">
                        <i class="bi bi-list" style="font-size: 1.8rem;"></i>
                    </button>
                    <h4 class="mb-0 fw-bold d-none d-md-block text-dark tracking-tight">Officer Portal</h4>
                </div>
                <div class="header-profile d-flex align-items-center gap-3 ms-auto">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-dark text-decoration-none px-3 py-2 bg-main rounded-pill transition-smooth" data-bs-toggle="dropdown" style="border: 1px solid var(--border-light);">
                            <i class="bi bi-shield-lock-fill fs-5 me-2 text-primary"></i>
                            <span id="user-name" class="fw-bold small me-1">Officer</span>
                            <i class="bi bi-chevron-down small text-muted ms-1" style="font-size: 0.75rem;"></i>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border border-light rounded-4 mt-2">
                            <li><a class="dropdown-item py-2 fw-medium text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2 text-danger"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- Scrollable Page Content -->
            <div class="flex-grow-1 overflow-auto p-3 p-md-4 position-relative">
                <div id="alert-container" class="mt-3"></div>

                <section id="section-dashboard" class="dashboard-section">
                    <h2 class="mt-4">Field Officer Dashboard</h2>
                    
                    <div class="row mt-4">
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="stat-number" id="stat-total">0</div>
                                <div class="stat-label">Assigned</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="stat-number" id="stat-pending">0</div>
                                <div class="stat-label">Pending</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="stat-number" id="stat-progress">0</div>
                                <div class="stat-label">In Progress</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="stat-number" id="stat-completed">0</div>
                                <div class="stat-label">Completed</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card mt-4">
                        <div class="card-header"><h5 class="mb-0">My Tasks</h5></div>
                        <div class="card-body">
                            <div id="tasks-list"></div>
                        </div>
                    </div>
                </section>

                <section id="section-assigned" class="dashboard-section" style="display: none;">
                    <h2 class="mt-4">Assigned Tasks</h2>
                    <div class="card">
                        <div class="card-body">
                            <div id="assigned-list"></div>
                        </div>
                    </div>
                </section>

                <section id="section-update" class="dashboard-section" style="display: none;">
                    <h2 class="mt-4">Update Status & Upload Proof</h2>
                    <div class="card">
                        <div class="card-body">
                            <div id="update-list"></div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Update Modal -->
    <div class="modal fade" id="updateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="update-status">
                            <option value="in_progress">Start Working</option>
                            <option value="completed">Mark Completed</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Remarks</label>
                        <textarea class="form-control" id="update-remarks" rows="3" placeholder="Describe work done..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">After Photo</label>
                        <input type="file" class="form-control" id="update-image" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="submitUpdate()">Submit Update</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Complaint Detail Modal -->
    <div class="modal fade" id="complaintDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Complaint Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="complaint-detail-content">
                    <!-- Content loaded dynamically -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/main.js"></script>
    <script>
        let selectedComplaintId = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            if (!checkAuth()) { window.location.href = 'login.html'; return; }
            currentUser = JSON.parse(localStorage.getItem('user'));
            if (currentUser.role !== 'officer') { window.location.href = 'login.html'; return; }
            
            document.getElementById('user-name').textContent = currentUser.name;
            await loadData();
        });

        async function loadData() {
            const stats = await getStats();
            document.getElementById('stat-total').textContent = stats.total || 0;
            document.getElementById('stat-pending').textContent = (stats.by_status?.pending || 0) + (stats.by_status?.reassigned || 0);
            document.getElementById('stat-progress').textContent = stats.by_status?.in_progress || 0;
            document.getElementById('stat-completed').textContent = stats.by_status?.completed || 0;
            
            const complaints = await getComplaints();
            renderTasks(complaints);
        }

        function renderTasks(complaints) {
            const containers = ['tasks-list', 'assigned-list', 'update-list'];
            
            if (!complaints.length) {
                containers.forEach(id => {
                    document.getElementById(id).innerHTML = '<p class="text-muted">No tasks assigned</p>';
                });
                return;
            }
            
            const html = complaints.map(c => `
                <div class="complaint-card priority-${c.priority}">
                    <div class="row">
                        <div class="col-md-3">
                            ${c.before_image ? 
                                `<img src="${API_BASE}/uploads/before/${c.before_image}" class="complaint-image">` :
                                `<div class="complaint-image bg-light d-flex align-items-center justify-content-center"><i class="bi bi-camera text-muted"></i></div>`
                            }
                        </div>
                        <div class="col-md-6">
                            <h6>${c.title}</h6>
                            <p class="text-muted small">${c.description.substring(0, 80)}...</p>
                            <p class="small"><strong>Location:</strong> ${c.address || 'N/A'}</p>
                            <small class="text-muted">Assigned: ${formatDate(c.assigned_at)}</small>
                        </div>
                        <div class="col-md-3 text-end">
                            <span class="status-${c.status}">${c.status}</span><br>
                            <button class="btn btn-sm btn-info mt-2 me-1" onclick="showComplaintDetail(${c.id})">View</button>
                            <button class="btn btn-sm btn-primary mt-2" onclick="openUpdateModal(${c.id})">Update</button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            containers.forEach(id => {
                document.getElementById(id).innerHTML = html;
            });
        }

        function openUpdateModal(complaintId) {
            selectedComplaintId = complaintId;
            document.getElementById('update-status').value = 'in_progress';
            document.getElementById('update-remarks').value = '';
            document.getElementById('update-image').value = '';
            new bootstrap.Modal(document.getElementById('updateModal')).show();
        }

        async function submitUpdate() {
            const status = document.getElementById('update-status').value;
            const remarks = document.getElementById('update-remarks').value;
            
            const result = await updateComplaintStatus(selectedComplaintId, status, remarks);
            
            if (result.success) {
                // Upload after image if provided
                const imageFile = document.getElementById('update-image').files[0];
                if (imageFile) {
                    await uploadAfterImage(selectedComplaintId, imageFile);
                }
                
                showAlert('Updated successfully!', 'success');
                bootstrap.Modal.getInstance(document.getElementById('updateModal')).hide();
                loadData();
            } else {
                showAlert(result.error, 'danger');
            }
        }

        function showSection(section) {
            document.querySelectorAll('.dashboard-section').forEach(s => s.style.display = 'none');
            document.getElementById(`section-${section}`).style.display = 'block';
        }
    </script>
</body>
</html>
